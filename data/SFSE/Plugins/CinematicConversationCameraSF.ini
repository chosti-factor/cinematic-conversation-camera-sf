; Cinematic Conversation Camera SF
; Put your own changes in CinematicConversationCameraSF_user.ini (same folder, same
; section names) so updates don't overwrite them. This file is read again before
; every conversation, so changes apply without restarting the game.
; Key names: ending in Npc = about the people you talk to (or overhear), ending in Player =
; about you (your shots, body, face); no ending = the camera or both of you. 0.8.3 renamed
; keys to follow this (e.g. iReactionChance -> iReactionChancePlayer, bPlayerFace ->
; bFacePlayer); the old names still work.

[General]
; 1 = on, 0 = off (the game's own dialogue camera)
bEnabled=1
; Extra details in the log (Documents\My Games\Starfield\SFSE\Logs)
bDebugLog=1

[Director]
; Cinematic Conversation Camera's shot library and cutting rules.
; 1 = on, 0 = only the plain over-the-shoulder shots from [PlainCamera]
bEnabled=1

; The look. CCC's own presets, as faithful to CCC 1.5.0 as Starfield allows (its angles,
; moves, lenses and cutting; no reaction shots, emotion close-ups only in Close):
;   Standard      shoulders, close-ups, three-quarters and mediums on both sides
;   Close         shoulders, tight close-ups and extreme close-ups, pushing in
;   Room          wide and full-figure shots, room shots as far back as CCC's framing wants
; CCC SF's own, each with a film flavour, its own lenses, moves, cutting and sway, room
; shots no further back than 9 m indoors and 12 m outdoors, and everything this mod adds
; (emotion close-ups on every tier, reaction shots of you):
;   Frontier      a space western: Standard on longer lenses, slow dolly-like drifts
;   Starborn      Kubrick and Interstellar: faces centred, very slow push-ins, locked off
;   Constellation a hard sci-fi documentary: from across the room, handheld drifts
;   Nebula        a trailer: every angle and every move, quick cutting
; All of it, shot by shot: docs/PRESETS.md.
sPreset=Standard

; How lively the cutting is. Preset (the default) = the preset's own rhythm: CCC's as CCC
; 1.5.0 sets them (Standard a new angle every 2-3 lines, Close every 3-6, Room every 3-5,
; never just because the turn passed), CCC SF's SpaceWestern for now. Or one style for every
; preset, calmest first:
;   Cinematic    - each person keeps their angle; a new one only after 4-8 of their lines
;   Odyssey      - CCC's own rhythm: occasionally a fresh angle when the turn passes
;   SpaceWestern - a fresh angle on about half the turns
;   Dogfight     - fresh angles on most turns
;   SpaceOpera   - a new angle on every turn
sCuttingStyle=Preset

; Fine-tuning (each overrides the style's own value when the ";" is removed): a new angle
; on the same person after this many of their lines (random between the two), never
; sooner than fShortestHold seconds after the last change. Lines shorter than
; fShortLineSeconds don't count.
;iMinLines=2
;iMaxLines=5
;fShortestHold=2.0
fShortLineSeconds=1.2

; The furthest the camera may stand from the person it frames, in metres, indoors and
; outdoors. Starfield's conversation lens is narrower than the ones CCC uses in Skyrim,
; so its framings want the camera further back. 0 = the preset's own, as far as its
; widest shot wants (obstacle detection keeps the camera out of walls):
;   Close     5 m indoors,  5 m outdoors
;   Standard  7 m indoors, 10.5 m outdoors (the two-shot of you both needs 10.2 m)
;   Room      7 m indoors, 13 m outdoors (the full-figure shots need 12.7 m)
;   Starborn  5 m indoors,  5 m outdoors (as Close)
;   Constellation, Frontier, Nebula  7 m indoors, 13 m outdoors (as Room)
; (Room shots have their own limits, below.)
; Any other value (1-15) is your own limit, whatever the preset; lower values make the
; wider shots tighter, never wider.
fMaxCameraDistance=0
fMaxCameraDistanceExterior=0

; Obstacle detection: before cutting to a shot, ask the game's collision whether anything
; (a wall, a ladder, a pillar) stands between the camera and the person in shot. A wall
; behind the camera pulls the camera in; anything close to the person skips the shot.
; 0 = off. fObstacleRadius is how wide the check is, in metres (the game's own uses 0.05).
bObstacleCheck=1
fObstacleRadius=0.05

; The 180-degree rule. Each conversation is staged from one side of the line between you
; (the side with more room, or a coin toss).
; bTrue180: 1 = every shot from that one side (you over one shoulder, them over the
;   other), so you face each other across every cut, as in films. 0 = each of you is
;   filmed over your own same-side shoulder (CCC's default).
; bEnforceLine: 1 = no shot, camera move or face turn takes the camera across the line
;   or within a few degrees of it (always on with bTrue180).
bTrue180=0
bEnforceLine=1

; 1 = close-ups follow the face: the camera turns toward a face turned to its work (up to
; 35 degrees) and drops to look up into a lowered one, decided at each cut (CCC's
; bFollowFace).
bFollowFace=1

; ---- Shots of you (Player) ----------------------------------------------------------
; Reaction shots: to break the monotony of a long stretch, one of their lines is shown on
; you. Once the camera has been on them for fReactionAfterSecondsPlayer of their talking
; without showing you (your own turns start it again), a reaction is due, iReactionChancePlayer
; % of the time (a no waits another stretch). The next line of theirs that suits it is shown
; on you from its start to its end, so the cuts fall at the edges of their lines: a line
; fReactionLineMinSecondsPlayer to fReactionLineMaxSecondsPlayer long (guessed from its
; subtitle), not a persuasion answer. Their emotion close-ups are part of the stretch: when
; the time on them reaches fReactionAfterSecondsPlayer during a regular one (never an extreme
; one, and not within its first fShortestHold seconds), the camera cuts to you there, to the
; end of the line. In a long speech, again after
; every stretch. Full rules: docs/REACTIONS.md.
; -1 = the preset's own: off in CCC's presets (as CCC ships), on in CCC SF's; 0 off, 1 on.
bReactionShotsPlayer=-1
; A close-up of you when you choose a tagged option ([Persuade], [Intimidate], [Chef],
; [Ronin], [Wanted]... every tag but [Pay ...]), for the line you say: an extreme close-up
; for the confrontational skills (Intimidate, Threaten, Manipulate, Deceive, Lie, Attack),
; the others iExtremeCloseUpChancePlayer % of the time. -1 = the preset's own: CCC SF's
; presets (CCC doesn't; it holds on their answer instead, as bPersuasionBeatNpc does here);
; 0 off, 1 on in every preset.
bChoiceCloseUpsPlayer=-1
; fReactionAfterSecondsPlayer: -1 = the preset's own (Frontier 10 s, Starborn 9 s,
; Constellation 12 s, Nebula 7 s); a number sets it for every preset.
fReactionAfterSecondsPlayer=-1
iReactionChancePlayer=100
fReactionLineMinSecondsPlayer=2.5
fReactionLineMaxSecondsPlayer=7
; A line up to a second longer is shown on you whole; a longer one takes it too: shown on
; you for its first fReactionLongLineSecondsPlayer seconds, then back to them for the rest
; (0 = wait for a line that suits).
fReactionLongLineSecondsPlayer=4
; A reaction is either you listening (the preset's angle of you: your regular shots, never
; the room or a two-shot) or, when your face shows an expression on that line, a close-up
; of you, by the expression's tier (the same mild / medium / strong lists as for them,
; below): these % of the time (iExtremeCloseUpChancePlayer of those extreme close-ups).
iCloseUpChanceMildPlayer=25
iCloseUpChanceMediumPlayer=40
iCloseUpChanceStrongPlayer=100
iExtremeCloseUpChancePlayer=40
; With seated people and merchants, a listening reaction is the plain over-the-shoulder shot
; of you.

; Bystanders: someone standing still (for fBystanderStillNpc seconds) who would cover a face
; or most of the picture makes the camera pull in past them or pick another angle, like a
; wall. People walking through the shot are left in: they keep it lively.
bAvoidBystandersNpc=1
fBystanderStillNpc=1.5

; Persuasion beat (CCC's "Hold On Their Answer"): the NPC's answer is a close-up of them,
; pushing in slowly, held for their whole reply (in a long answer, over 10 s, one cut to a
; wider shot of them once the push-in is done; never away from them, no reaction shots). In the
; persuasion mini-game, their answer to every round, the verdict included; with seated people
; too, whatever the preset's emotion close-ups. Also for options tagged with a skill check
; from sBeatTags ([Persuade] itself starts the mini-game). A tag starting with a word on
; the list counts; "Pay" would match "[Pay 500 Credits]", but that's also how you hire crew.
bPersuasionBeatNpc=1
sBeatTags=Intimidate,Intimidation,Manipulate,Manipulation,Bribe,Deceive,Deception,Lie,Threaten,Diplomacy,Negotiate,Commerce

; ---- Emotion close-ups of the speaker (Npc) ------------------------------------------
; 1 = when someone starts a line tagged with one of these expressions, push in to a
; close-up of them (iExtremeCloseUpChanceNpc of those an extreme close-up), with a slow
; push-in, also for seated people and merchants. CCC does this for the lines Skyrim's
; writers marked at full strength; Starfield's lines have no strength, only the expression
; tag, so the expressions come in three tiers, each with its own chance (%): mild (everyday
; tone), medium (real but often understated feeling) and strong (what close-ups are for).
; Neutral and Friendly (a quarter of all lines) are on none. Move an expression between
; lists to change its tier. All the game's expressions: docs/EMOTIONS.md. At these chances,
; about one NPC line in five gets an emotion close-up.
; -1 = the preset's own: CCC's presets as CCC (none in Standard and Room, which have no
; angle for it; strong lines only in Close, CCC's "full intensity"), every tier in CCC SF's;
; 0 none, 1 every tier in every preset.
bEmotionCloseUpsNpc=-1
sCloseUpEmotionsMildNpc=Amused,Confident,Thinking,Grateful,Question,Impressed,Tired,Concentrating,Relieved
iCloseUpChanceMildNpc=25
sCloseUpEmotionsMediumNpc=Concerned,Serious,Smirk,Happy,Confused,Puzzled,Apologetic,Awed
iCloseUpChanceMediumNpc=40
sCloseUpEmotionsStrongNpc=VeryAngry,Rage,Angry,Irritated,Afraid,Shocked,Surprised,Disgust,Somber,Depressed,Worried,Nervous,Pleading,Disbelief,Defiant,Stern,Suspicious,Smug,Sarcastic,Flirting,SinisterSmile,InPain,Dying,EyesClosed
iCloseUpChanceStrongNpc=100
; Of those close-ups, how many (%) are extreme close-ups (CCC: about a third).
iExtremeCloseUpChanceNpc=40
; How far back close-ups and extreme close-ups stand, in % of CCC's distance (80-150).
; -1 = CCC's distance (100), now that every preset has its own lenses.
iCloseUpDistance=-1
; Room shots (Wide, Master, Distant; in Room, Frontier and Constellation, and Distant in
; Close and Starborn) stand where the room
; measurement found space on the conversation's side, with both faces in view, as far back
; as CCC's framing wants. Where the room gives less than this % of that distance (30-100),
; they're left out. Lower lets them into smaller rooms, with the people larger in the picture.
iRoomShotMinRoom=60
; How far back room shots may stand, in metres, indoors and outdoors. -1 = the preset's
; own (CCC's presets: as far as CCC's framing wants, about 12 to 18 m at the 45 degree
; lens; CCC SF's: 9 m indoors, 12 m outdoors); 0 = as far as CCC's framing wants in any
; preset; any other value is your own limit. The limit is for the furthest (Master); Distant
; and Wide stay closer in proportion. Closer makes the people larger.
fRoomShotMaxIndoors=-1
fRoomShotMaxOutdoors=-1

; 1 = people sitting down and merchants get the plain over-the-shoulder shot instead of
; the shot library: its angles often put the chair or the shop counter in front of them.
bPlainShotsSeatedNpc=1
bPlainShotsMerchantsNpc=1

; 1 = camera moves during shots (push in, crane, drift...), 0 = all shots locked off.
bCameraMoves=1

[Shots]
; Change individual shots of the preset. Remove the ";" to use a line.
; Weight (how often it's picked, 0-100; 0 turns it off, and a shot the preset doesn't
; use can be added this way):
;CloseUp=80
; Move: None, Push in, Pull out, Crane up, Crane down, Tilt up, Tilt down, Drift,
; Zoom in, Zoom out (done as push/pull here), Orbit left, Orbit right, Slide left,
; Slide right. Amount 0-100, time in seconds.
;CloseUpMove=Push in
;CloseUpMoveAmount=40
;CloseUpMoveTime=6
;
; Shot names, of them: OverPlayerShoulder, OverPlayerShoulderLow, OverPlayerShoulderHigh,
; OverPlayerShoulderWide, DirtyNpc, ThreeQuarterNpc, CloseUp, ExtremeClose, CloseLow,
; CloseHigh, CloseProfile, CloseWide, MediumNpc, MediumProfile, LowAngle, LowProfile,
; LongNpc, Overhead
; Of you: OverNpcShoulder, OverNpcShoulderLow, OverNpcShoulderHigh, OverNpcShoulderWide,
; DirtyPlayer, ThreeQuarterPlayer, ClosePlayer, ExtremeClosePlayer, MediumPlayer,
; PlayerProfile, PlayerLow, HighAngle, LongPlayer, PlayerOverhead
; Of both: TwoShot, Profile (the two-shot needs about 10 m, so outdoors only by default)
; Of the room (where the room measurement finds space): Wide, Master, Distant, DistantLow
; (GroundLevel isn't available yet)

[Camera]
; The conversation lens, in degrees. Starfield films conversations through a narrow 30
; degree lens, so CCC's framings need the camera about twice as far back as in Skyrim: wide
; shots rarely fit indoors and over-the-shoulder shots meet walls more often. A wider lens
; frames the same shots from closer, with less of the flattened, telephoto look. Only while
; this mod films a conversation.
; -1 = the preset's own: 45 for CCC's presets (Standard, Close, Room), 37.5 for CCC SF's
;      (Frontier, Starborn, Constellation, Nebula), a little closer to Starfield's own look
;  0 = the game's own 30
; 20-70 = your own, for every preset
fConversationLens=-1
; 0 = always over your shoulder (the NPC in frame)
; 1 = always over their shoulder (you in frame)
; 2 = whoever is talking gets the camera (shot/reverse-shot)
iShotMode=2

; Head movement (metres) the camera ignores before following: idle sway and the bob of
; someone working at a bench stay off the screen; leaning or walking is followed.
fFaceDeadband=0.04

; How much the camera sways with the two of you, 0-100%. Its angles are measured off the
; line between you; heads swaying a few centimetres turn that line, and a camera several
; metres out swings with it. 0 = no sway (the line from where you stand, like a camera on a
; tripod), 100 = the full sway of 0.6.0 (the line between your heads); in between dampens it.
; -1 = the preset's own: 0 in CCC's (a tripod, as CCC) and Starborn (locked off), Nebula 40,
; Frontier 50 (a touch of handheld), Constellation 70 plus a slow handheld wander (the
; documentary operator's). 0 also turns Constellation's handheld wander off.
iCameraSway=-1

; Seconds of smoothing when the camera follows someone who moves.
; Higher = steadier but slower to follow. 0 = follow instantly (can vibrate).
fFollowSmoothing=0.35
; While the person speaking moves their head faster than fBusyHeadSpeed (metres per
; second; walking is about 0.3 and up), follow them with this much smoothing instead:
; their head bobs with each step, and following it closely made the picture jitter.
fBusyFollowSmoothing=1.0
fBusyHeadSpeed=0.25

; Third person: after the last line, hold the final shot this many seconds before
; showing your third-person view again.
fExitHoldSeconds=0.5

; Speakers shorter than this (metres, head above feet), or without a head (small
; robots), keep the game's own camera.
fMinSpeakerHeightNpc=1.0

; 1 = quest scenes you're part of (someone walks up and starts talking, several people
; taking turns) keep the game's own camera; the game directs its camera there. Everyday
; background scenes (merchants, people chatting) keep this mod's camera. 0 = always this
; mod's camera.
bGameCameraInScenes=1

; 1 = keep the person in shot in focus. The game's conversation blur focuses about 2 m
; from the camera; this sets its focus to the distance from the camera to whoever is in
; shot, on every shot (the background keeps its blur). Shots from more than 8 m away (the
; room shots) have no blur at all.
bFocusOnSubject=1

; Focus style:
;   Cinematic - more background blur
;   Wide      - deeper sharp zone, softer background blur (on shots where the camera is
;               further than fWideFocusBeyond metres from the person in shot)
sFocusStyle=Wide
fWideFocusBeyond=3.5

[Body]
; 1 = show your character during conversations (Starfield hides them).
bRevealPlayer=1

; 1 = when a conversation starts in first person, build your character's full body
; first (otherwise the first-person body is shown, which looks broken).
bFixFirstPersonBodyPlayer=1

; How that body is built: 1 = ask the game to refresh your model (no camera switching),
; 0 = the older method, briefly switching the game to third person and back.
iBodyRebuildMethodPlayer=1

; Which parts the refresh asks for (1 model, 2 skin, 4 head, 8 face, 16 scale,
; 32 skeleton; added up). 63 = all. 33 leaves the head missing.
iBodyUpdateFlagsPlayer=63

[Transitions]
; What the first frames show while the game is still switching to its dialogue camera,
; for conversations started in first person (iStartMode) and third person:
;   0 = your view from just before the conversation
;   1 = the first conversation shot, placed where the game's dialogue camera will be
;   2 = your view from just before, placed the same way
iStartMode=1
iStartModeThirdPerson=2
; First person: how the switch back is covered. 1 = no cover (best in testing),
; 0 = cover the game's first first-person frame, 2 = cover three frames.
iExitMode=1

[PlainCamera]
; The plain shots used when [Director] is off, or no director shot fits. Metres.
; Over the shoulder:
fDistanceBehind=0.65
fSideOffset=0.32
fHeightOffset=0.06
fLookHeightOffset=-0.03
; When the person nearest the camera is sitting, the camera moves in front of and
; beside them instead of behind them, so chair backs don't block the view. Kept about
; 1 m from their head: closer, the game fades them out (they faded back in on the cut).
fSeatedForward=0.25
fSeatedSide=0.9
fSeatedHeight=0.3
; The other way round, you standing and them sitting: the camera behind you (this far),
; wider to the side and lower (this far from your head), so the line down to them passes
; clear of your shoulder instead of your body hiding them.
fOverSeatedBehind=0.35
fOverSeatedSide=0.6
fOverSeatedHeight=-0.25
; Merchants, on your lines: the camera stands in front of and beside them (fSeatedForward
; ahead, this far to the side, this far above their head), facing you. Behind them it was
; close enough that the game faded them out, and shops keep shelves and counters there.
fVendorSideNpc=0.9
fVendorHeightNpc=0.05

[Interface]
; Black bars across the top and bottom of the screen while the camera films a
; conversation (not in quest scenes, where the game keeps its own camera). They sit under
; the dialogue menu, so its subtitles and options stay on top. fLetterboxHeight is each
; bar's share of the screen height (0.12 is close to a 2.39:1 film frame on a 16:9 screen);
; fLetterboxFade is how long they take to slide in or out, in seconds.
bLetterbox=1
fLetterboxHeight=0.12
fLetterboxFade=0.4

; Starfield already puts the conversation's subtitle at the top edge of the bottom bar.
; 1 = while the bars are in, move it down so it's centred in the bar, and back when they go.
bSubtitlesInBars=0

; The dialogue options. The game hides them during most NPC lines, but shows them during
; the greeting, with the subtitle running across the last one.
; bHideOptionsWhileSpeaking: 1 = they fade out whenever the NPC is speaking, and back in
;   when the line ends (CCC's option), except during their first line: the game shows the
;   options during greetings, where A or a click chooses one rather than skipping the line,
;   so they stay visible then (0.8.6: hidden, "Let's trade gear" was chosen unseen with Sam
;   and Vasco). They can still be chosen while faded out on later lines.
; bFadeOptions: 1 = they fade in over fOptionsFade seconds when they appear, instead of
;   popping in (0 = no fade, up to 1.5; when they go, the game hides them itself, too
;   quickly to fade).
bHideOptionsWhileSpeaking=1
bFadeOptions=1
fOptionsFade=0

[Overhear]
; Filming people talking near you (0.8). When people within fListenRange metres talk to
; each other, the camera can film whoever is speaking against whoever they're addressing, a
; new shot for each line. Moving, a conversation of your own, combat, or the conversation
; ending hands the camera back: fFilmEndSecondsNpc after the last word, or up to
; fFilmEndSecondsSceneNpc while they're still playing their part in one of the game's
; scenes (which pause between lines). Never offered or started in combat. One scene at a
; time, the nearest first, then the next one nearby; a scene that goes on into the game's
; next scene with the same people is followed; one that only repeats itself is handed back.
; Letterboxed (bLetterbox), with a group shot now and then when three or more are talking.
bFilmConversationsNpc=1
; Two ways to start it (both can be on):
; 1 = a prompt on screen, below the crosshair (not while bAutoListen is on: it starts on its
;     own then): "Listen in on nearby conversation. Press N"
;     (or "Hold" and the B button's icon when you're playing with a controller), in the look
;     of the game's own
;     interaction prompt; the listen key or button starts it and stops it. While the camera
;     films them, the game's name tags and interaction prompt are hidden.
bListenPrompt=1
; 1 = it starts on its own when a conversation begins near you (within fListenRange), even
;     while you're walking: moving then ends it (after a moment to stop). A conversation
;     you've ended by moving or with the listen key doesn't start again on its own for two
;     minutes (the listen key: none at all for a minute).
; Both only for conversations (the game's scenes of people talking); barks and one-liners
; ("Need something?") are left alone. The listen key still films anyone talking.
bAutoListen=1
fFilmEndSecondsNpc=0.5
fFilmEndSecondsSceneNpc=4
; The listen key, as a Windows virtual-key code (78 = N; 0 = no prompt, no key). Keyboard
; only for now.
iListenKey=78
; The controller's listen button, held for fListenHold seconds (so a tap still does what
; the game uses it for). XInput button codes: 8192 = B (default), 128 = right stick click,
; 64 = left stick click, 1/2/4/8 = D-pad up/down/left/right, 32 = View, 256/512 = LB/RB,
; 4096/8192/16384/32768 = A/B/X/Y; 0 = no controller button.
iListenButton=8192
fListenHold=0.5
fListenRange=12

[Face]
; 1 = your character's face takes expressions during conversations (the game keeps it
; neutral): while the NPC speaks, a response to their line's expression (a smile for a
; smile, concern for worry, a guarded look or anger back for anger); when you choose an option with a
; skill tag ([Persuade], [Intimidate]...), an expression for it. Your face goes back to the
; game's own when the conversation ends.
bFacePlayer=1
; Your background shows on your face now and then: at moments it would otherwise be neutral
; (an NPC line with no expression, an option without a skill tag), this chance (%, 0-100)
; of your background's expression instead: Space Scoundrel and Cyber Runner smirk, Gangster
; looks smug, Bounty Hunter suspicious, Diplomat and Homesteader friendly, Professor and
; Sculptor thoughtful, Soldier and Beast Hunter serious, Bouncer and Ronin stern, Chef happy,
; Combat Medic concerned, Explorer awed, Industrialist confident, Long Hauler tired, Pilgrim
; at ease, Cyberneticist and Xenobiologist focused. Full tables: docs/EMOTIONS.md.
iSignatureChancePlayer=30
; An option without a tag that asks a question ("...?"): this chance (%, 0-100) you ask it
; with a questioning look.
iQuestionChancePlayer=40
; (Close-ups of your face: iCloseUpChancePlayer in [Director], with the reaction shots.)

[Debug]
; 1 = on-screen messages while testing: each spoken line's expression tag, and each shot
; the camera uses by its [Shots] name and why. A line and the cut it brings show as one
; message, e.g. "Sarah Morgan: Surprised (#3) | Camera: CloseUp (emotion close-up)";
; "same shot" means the camera held its shot for that line, "no close-up" that a close-up
; expression didn't get one. Handy for sorting the sCloseUpEmotions...Npc tiers and building your own mix
; of shots. (Replaces bShowEmotions and bShowShots; an INI with those still works.)
bShowMessages=1
; While a conversation is filmed, the messages show in the top bar, looking like the game's
; own notifications, each staying until the next one or this many seconds (1-30). Outside
; conversations they're the game's own notifications. The preset in use stays in the bottom
; bar's right-hand side ("PRESET: FRONTIER").
fMessageSeconds=6
; The preset key: switches to the next preset on the fly, also mid-conversation (Standard,
; Close, Room, Frontier, Starborn, Constellation, Nebula, then Standard again), until the
; game is restarted; sPreset sets the one it starts with. A Windows virtual-key code: 85 = U
; (Starfield doesn't use U; P is its Skills key). 0 = no key. Not while the console is open.
iPresetKey=85
; 1 = write the dialogue menu's and the HUD's layout to the log once per game session
; (testing aid for the subtitle and dialogue option features).
bDumpMenus=1
; 1 = hook the first- and third-person cameras (needed for the older body method and
; the exit to first person). Takes effect on the next game start.
bStateHooks=1
; 1 = move only what you see on screen, so NPCs keep facing you (recommended);
; 0 = move the game's own camera (NPCs turn to face it).
iCameraTarget=1

[GameSettings]
; The game's own settings, changed while it runs ("name:Section=value"). Remove the ";"
; to use a line; put it back to restore the game's value. Possibly makes conversation
; starts a little sharper:
;fDialogueCameraResumeTime:Dialogue=0
