; Cinematic Conversation Camera SF - milestone 1 test build
; Put your own changes in CinematicConversationCameraSF_user.ini (same folder,
; same section names) so updates don't overwrite them.

[General]
; 1 = on, 0 = off (vanilla dialogue camera)
bEnabled=1
; Extra details in the log while we're testing
bDebugLog=1

[Camera]
; 0 = always over the player's shoulder (NPC in frame)
; 1 = always over the NPC's shoulder (player in frame)
; 2 = whoever is talking gets the camera (shot/reverse-shot)
iShotMode=2

; Over-the-shoulder framing, in meters (Starfield's world unit)
fDistanceBehind=0.65
fSideOffset=0.32
fHeightOffset=0.06
fLookHeightOffset=-0.03

; Which camera to move.
; 1 = only what you see on screen; the game still thinks the camera is at your
;     eyes, so NPCs keep facing you (recommended)
; 0 = the game's own camera; NPCs turn to face wherever the camera is
iCameraTarget=1

; 1 = show your character during conversations (Starfield hides them by default)
bRevealPlayer=1

; 1 = when a conversation starts in first person, rebuild your character's full body
;     before showing them (the view flickers briefly once near the start), then go
;     back to first person afterwards. 0 = off (your character may look broken).
bFixFirstPersonBody=1

; 1 = return to the normal view as soon as the conversation is over.
; 0 = wait for the game's own dialogue camera to finish (about 1.5 seconds).
; Experimental: set to 0 if controls or the view misbehave after conversations.
bFastExit=1

; Seconds of smoothing when the camera follows someone who moves.
; Higher = steadier but slower to follow. 0 = follow instantly (can vibrate).
fFollowSmoothing=0.35

; Not used yet (cuts are instant in this build)
fBlendSeconds=0

[Debug]
; How the camera position is written. If the camera doesn't move in conversations,
; try 1, then 2, and tell us which one worked.
; 0 = full update, 1 = position only, 2 = world position only
iPoseMode=0
