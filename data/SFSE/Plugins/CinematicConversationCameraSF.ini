; Cinematic Conversation Camera SF - milestone 1 test build
; Put your own changes in CinematicConversationCameraSF_user.ini (same folder,
; same section names) so updates don't overwrite them.

[General]
; 1 = on, 0 = off (vanilla dialogue camera)
bEnabled=1
; Extra details in the log while we're testing
bDebugLog=1

[Camera]
; 0 = always over the player's shoulder (NPC in frame)
; 1 = always over the NPC's shoulder (player in frame)
; 2 = whoever is talking gets the camera (shot/reverse-shot)
iShotMode=2

; Over-the-shoulder framing, in meters (Starfield's world unit)
fDistanceBehind=0.65
fSideOffset=0.32
fHeightOffset=0.06
fLookHeightOffset=-0.03

; Which camera to move.
; 1 = only what you see on screen; the game still thinks the camera is at your
;     eyes, so NPCs keep facing you (recommended)
; 0 = the game's own camera; NPCs turn to face wherever the camera is
iCameraTarget=1

; 1 = show your character during conversations (Starfield hides them by default)
bRevealPlayer=1

; 1 = when a conversation starts in first person, rebuild your character's full body
;     before showing them (the view flickers briefly once near the start), then go
;     back to first person afterwards. 0 = off (your character may look broken).
bFixFirstPersonBody=1

; 1 = do that rebuild on the very first frames of the conversation, while still showing
;     your first-person view, then cut to the NPC. 0 = do it a quarter second in, after
;     the first shot of the NPC (the picture visibly zooms out and back).
bEarlyBodyRebuild=1

; After the last line, hold the final shot this many seconds, then hand back to the
; game's own camera while it finishes closing the conversation. The game takes about
; 1.5 seconds to close; 2 = hold the final shot the whole time, 0 = hand back at once.
fExitHoldSeconds=0.5

; 0 = over-the-shoulder shots: the camera sits behind the nearer character. If they
;     have their back to a wall, the camera can end up inside the wall.
; 1 = the camera always sits in front of and beside the nearer character (using the
;     fSeated... values below), in the open space between the two of you.
iShotStyle=0

; When the character nearest the camera is sitting, the camera moves in front of and
; beside them instead of behind them (so chair backs don't block the view). Meters.
fSeatedForward=0.25
fSeatedSide=0.45
fSeatedHeight=0.12

; Seconds of smoothing when the camera follows someone who moves.
; Higher = steadier but slower to follow. 0 = follow instantly (can vibrate).
fFollowSmoothing=0.35

; Not used yet (cuts are instant in this build)
fBlendSeconds=0

; Field of view of the conversation shots, in degrees. 0 = the game's own (30, a tight
; close-up). Try 50. Read again at the start of every conversation.
fDialogueFOV=0

[Debug]
; Test switch. 1 = hook the first- and third-person cameras, which hides the body
; rebuild at the start of first-person conversations. 0 = don't (the rebuild is more
; visible). Takes effect on the next game start.
bStateHooks=1

; How the camera position is written. If the camera doesn't move in conversations,
; try 1, then 2, and tell us which one worked.
; 0 = full update, 1 = position only, 2 = world position only
iPoseMode=0

; Test switch for finding the dialogue camera's zoom. Read again at the start of every
; conversation, so you can change it without restarting the game (alt-tab, edit, save).
; While a conversation runs, the listed game settings are set to fFovExperimentValue,
; then put back when it ends.
; 0 = off
; 1 = fTPWorldFOV + fFPWorldFOV
; 2 = fDialogueCameraFailsafeFPFOV
; 3 = fDefault1stPersonFOV + fFPGeometryFOV
; 4 = a value inside the dialogue camera itself
iFovExperiment=0
fFovExperimentValue=50

; Test switch for seated speakers, where the game refuses the usual body rebuild. Asks the
; game to refresh your character's 3D model directly. Add up the parts to refresh:
; 1 model, 2 skin, 4 head, 8 face, 32 skeleton. Try 33, then 47. 0 = off.
; Experimental: save your game first.
iBodyUpdateFlags=0
