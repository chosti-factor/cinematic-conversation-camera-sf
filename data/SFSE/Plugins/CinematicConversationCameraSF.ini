; Cinematic Conversation Camera SF
; Put your own changes in CinematicConversationCameraSF_user.ini (same folder, same
; section names) so updates don't overwrite them. This file is read again before
; every conversation, so changes apply without restarting the game.

[General]
; 1 = on, 0 = off (the game's own dialogue camera)
bEnabled=1
; Extra details in the log (Documents\My Games\Starfield\SFSE\Logs)
bDebugLog=1

[Director]
; Cinematic Conversation Camera's shot library and cutting rules.
; 1 = on, 0 = only the plain over-the-shoulder shots from [PlainCamera]
bEnabled=1

; The look: Standard (shoulders, close-ups, three-quarters and mediums on both sides),
; Close (shoulders and tight close-ups), Room (wide and full-figure shots) or Stardust
; (CCC SF's own: Standard with Room's wider shots mixed in, about 60/40, the wider ones
; with cranes, pull-outs and drifts). Room shots (Master, Wide, Distant) aren't available
; yet; Room and Stardust use the rest of their shots meanwhile.
sPreset=Standard

; How lively the cutting is, calmest first:
;   Cinematic    - each person keeps their angle; a new one only after 4-8 of their lines
;   Odyssey      - CCC's own rhythm: occasionally a fresh angle when the turn passes
;   SpaceWestern - a fresh angle on about half the turns
;   Dogfight     - fresh angles on most turns
;   SpaceOpera   - a new angle on every turn
sCuttingStyle=SpaceWestern

; Fine-tuning (each overrides the style's own value when the ";" is removed): a new angle
; on the same person after this many of their lines (random between the two), never
; sooner than fShortestHold seconds after the last change. Lines shorter than
; fShortLineSeconds don't count.
;iMinLines=2
;iMaxLines=5
;fShortestHold=2.0
fShortLineSeconds=1.2

; The furthest the camera may stand from the person it frames, in metres, indoors and
; outdoors. Starfield's conversation lens is narrower than the ones CCC uses in Skyrim,
; so its framings want the camera further back. 0 = the preset's own, as far as its
; widest shot wants (obstacle detection keeps the camera out of walls):
;   Close     5 m indoors,  5 m outdoors
;   Standard  7 m indoors, 10.5 m outdoors (the two-shot of you both needs 10.2 m)
;   Room      7 m indoors, 13 m outdoors (the full-figure shots need 12.7 m)
;   Stardust  7 m indoors, 13 m outdoors (as Room)
; Any other value (1-15) is your own limit, whatever the preset; lower values make the
; wider shots tighter, never wider.
fMaxCameraDistance=0
fMaxCameraDistanceExterior=0

; Obstacle detection: before cutting to a shot, ask the game's collision whether anything
; (a wall, a ladder, a pillar) stands between the camera and the person in shot. A wall
; behind the camera pulls the camera in; anything close to the person skips the shot.
; 0 = off. fObstacleRadius is how wide the check is, in metres (the game's own uses 0.05).
bObstacleCheck=1
fObstacleRadius=0.05

; The 180-degree rule. Each conversation is staged from one side of the line between you
; (the side with more room, or a coin toss).
; bTrue180: 1 = every shot from that one side (you over one shoulder, them over the
;   other), so you face each other across every cut, as in films. 0 = each of you is
;   filmed over your own same-side shoulder (CCC's default).
; bEnforceLine: 1 = no shot, camera move or face turn takes the camera across the line
;   or within a few degrees of it (always on with bTrue180).
bTrue180=0
bEnforceLine=1

; 1 = close-ups follow the face: the camera turns toward a face turned to its work (up to
; 35 degrees) and drops to look up into a lowered one, decided at each cut (CCC's
; bFollowFace).
bFollowFace=1

; 1 = when someone starts a line tagged with one of these expressions, push in to a
; close-up of them (iExtremeCloseUpChance of the time an extreme close-up), with a slow
; push-in, also for seated people and merchants. CCC does this for the lines
; Skyrim's writers marked at full strength. Starfield's tags include Friendly, Confident,
; Grateful, Amused, Happy, Question, Thinking, Smirk, Somber, Nervous, Tired, Irritated,
; Surprised... (bShowEmotions shows them as they're spoken).
bEmotionCloseUps=1
sCloseUpEmotions=Angry,Irritated,Annoyed,Surprised,Fearful,Scared,Disgusted,Somber,Sad,Nervous,Worried,Concerned,Awed,Apologetic,Disgust,Serious,Confused
; Of those close-ups, how many (%) are extreme close-ups (CCC: about a third).
iExtremeCloseUpChance=40

; 1 = people sitting down and merchants get the plain over-the-shoulder shot instead of
; the shot library: its angles often put the chair or the shop counter in front of them.
bPlainShotsSeated=1
bPlainShotsMerchants=1

; 1 = camera moves during shots (push in, crane, drift...), 0 = all shots locked off.
bCameraMoves=1

[Shots]
; Change individual shots of the preset. Remove the ";" to use a line.
; Weight (how often it's picked, 0-100; 0 turns it off, and a shot the preset doesn't
; use can be added this way):
;CloseUp=80
; Move: None, Push in, Pull out, Crane up, Crane down, Tilt up, Tilt down, Drift,
; Zoom in, Zoom out (done as push/pull here), Orbit left, Orbit right, Slide left,
; Slide right. Amount 0-100, time in seconds.
;CloseUpMove=Push in
;CloseUpMoveAmount=40
;CloseUpMoveTime=6
;
; Shot names, of them: OverPlayerShoulder, OverPlayerShoulderLow, OverPlayerShoulderHigh,
; OverPlayerShoulderWide, DirtyNpc, ThreeQuarterNpc, CloseUp, ExtremeClose, CloseLow,
; CloseHigh, CloseProfile, CloseWide, MediumNpc, MediumProfile, LowAngle, LowProfile,
; LongNpc, Overhead
; Of you: OverNpcShoulder, OverNpcShoulderLow, OverNpcShoulderHigh, OverNpcShoulderWide,
; DirtyPlayer, ThreeQuarterPlayer, ClosePlayer, ExtremeClosePlayer, MediumPlayer,
; PlayerProfile, PlayerLow, HighAngle, LongPlayer, PlayerOverhead
; Of both: TwoShot, Profile (the two-shot needs about 10 m, so outdoors only by default)
; Of the room (not available yet): Wide, Master, GroundLevel, Distant, DistantLow

[Camera]
; 0 = always over your shoulder (the NPC in frame)
; 1 = always over their shoulder (you in frame)
; 2 = whoever is talking gets the camera (shot/reverse-shot)
iShotMode=2

; Head movement (metres) the camera ignores before following: idle sway and the bob of
; someone working at a bench stay off the screen; leaning or walking is followed.
fFaceDeadband=0.04

; Seconds of smoothing when the camera follows someone who moves.
; Higher = steadier but slower to follow. 0 = follow instantly (can vibrate).
fFollowSmoothing=0.35
; While the person speaking moves their head faster than fBusyHeadSpeed (metres per
; second; walking is about 0.3 and up), follow them with this much smoothing instead:
; their head bobs with each step, and following it closely made the picture jitter.
fBusyFollowSmoothing=1.0
fBusyHeadSpeed=0.25

; Third person: after the last line, hold the final shot this many seconds before
; showing your third-person view again.
fExitHoldSeconds=0.5

; Speakers shorter than this (metres, head above feet), or without a head (small
; robots), keep the game's own camera.
fMinSpeakerHeight=1.0

; 1 = quest scenes you're part of (someone walks up and starts talking, several people
; taking turns) keep the game's own camera; the game directs its camera there. Everyday
; background scenes (merchants, people chatting) keep this mod's camera. 0 = always this
; mod's camera.
bGameCameraInScenes=1

; 1 = keep the person in shot in focus. The game's conversation blur focuses about 2 m
; from the camera; this sets its focus to the distance from the camera to whoever is in
; shot, on every shot (the background keeps its blur).
bFocusOnSubject=1

; Focus style:
;   Cinematic - more background blur
;   Wide      - deeper sharp zone, softer background blur (on shots where the camera is
;               further than fWideFocusBeyond metres from the person in shot)
sFocusStyle=Wide
fWideFocusBeyond=3.5

[Body]
; 1 = show your character during conversations (Starfield hides them).
bRevealPlayer=1

; 1 = when a conversation starts in first person, build your character's full body
; first (otherwise the first-person body is shown, which looks broken).
bFixFirstPersonBody=1

; How that body is built: 1 = ask the game to refresh your model (no camera switching),
; 0 = the older method, briefly switching the game to third person and back.
iBodyRebuildMethod=1

; Which parts the refresh asks for (1 model, 2 skin, 4 head, 8 face, 16 scale,
; 32 skeleton; added up). 63 = all. 33 leaves the head missing.
iBodyUpdateFlags=63

[Transitions]
; What the first frames show while the game is still switching to its dialogue camera,
; for conversations started in first person (iStartMode) and third person:
;   0 = your view from just before the conversation
;   1 = the first conversation shot, placed where the game's dialogue camera will be
;   2 = your view from just before, placed the same way
iStartMode=1
iStartModeThirdPerson=2
; First person: how the switch back is covered. 1 = no cover (best in testing),
; 0 = cover the game's first first-person frame, 2 = cover three frames.
iExitMode=1

[PlainCamera]
; The plain shots used when [Director] is off, or no director shot fits. Metres.
; Over the shoulder:
fDistanceBehind=0.65
fSideOffset=0.32
fHeightOffset=0.06
fLookHeightOffset=-0.03
; When the person nearest the camera is sitting, the camera moves in front of and
; beside them instead of behind them, so chair backs don't block the view. Kept about
; 1 m from their head: closer, the game fades them out (they faded back in on the cut).
fSeatedForward=0.25
fSeatedSide=0.9
fSeatedHeight=0.3
; Merchants, on your lines: the camera stands in front of and beside them (fSeatedForward
; ahead, this far to the side, this far above their head), facing you. Behind them it was
; close enough that the game faded them out, and shops keep shelves and counters there.
fVendorSide=0.9
fVendorHeight=0.05

[Debug]
; 1 = show each spoken line's expression tag as an on-screen message, with what the
; camera did for it, e.g. "Sarah Morgan: Somber - close-up (#2)". Handy for choosing
; sCloseUpEmotions.
bShowEmotions=1
; 1 = hook the first- and third-person cameras (needed for the older body method and
; the exit to first person). Takes effect on the next game start.
bStateHooks=1
; 1 = move only what you see on screen, so NPCs keep facing you (recommended);
; 0 = move the game's own camera (NPCs turn to face it).
iCameraTarget=1

[GameSettings]
; The game's own settings, changed while it runs ("name:Section=value"). Remove the ";"
; to use a line; put it back to restore the game's value. Possibly makes conversation
; starts a little sharper:
;fDialogueCameraResumeTime:Dialogue=0
