; Cinematic Conversation Camera SF
; Put your own changes in CinematicConversationCameraSF_user.ini (same folder, same
; section names) so updates don't overwrite them; the in-game settings page (SFSE Menu
; Framework) writes there too. Both files are read again whenever one changes, so changes
; apply without restarting the game (outside conversations, within half a second).
; The settings page has the main choices; everything else is here, each explained: each
; preset's own numbers in [PresetTuning] and [Shots], and the technical settings in
; [Advanced] at the end, rarely worth changing.
; Key names: ending in Npc = about the people you talk to (or overhear), ending in Player =
; about you (your shots, body, face); no ending = the camera or both of you.
; -1 on a setting means "the preset's own" wherever the comment says so.

[General]
; 1 = on, 0 = off (the game's own dialogue camera)
bEnabled=1
; Extra details in the log (Documents\My Games\Starfield\SFSE\Logs), for bug reports
bDebugLog=0

[Director]
; Cinematic Conversation Camera's shot library and cutting rules. Each preset's own numbers
; (close-up chances, distances, reaction timing): [PresetTuning].

; The look. CCC's own presets, as faithful to CCC 1.5.0 as Starfield allows (its angles,
; moves, lenses and cutting; no reaction shots, emotion close-ups only in Close):
;   Standard      shoulders, close-ups, three-quarters and mediums on both sides
;   Close         shoulders, tight close-ups and extreme close-ups, pushing in
;   Room          wide and full-figure shots, room shots as far back as CCC's framing wants
; CCC SF's own, each with a film flavour, its own lenses, moves, cutting and sway, room
; shots no further back than 9 m indoors and 12 m outdoors, and everything this mod adds
; (emotion close-ups on every tier, reaction shots of you):
;   Frontier      a space western: Standard on longer lenses, slow dolly-like drifts
;   Starborn      Interstellar with a touch of Kubrick: close, long lenses, faces a little
;                 off-centre, barely-there handheld, push-ins on emotional lines
;   Constellation a hard sci-fi documentary: from across the room, handheld drifts
;   Nebula        a space opera: every angle and every move, bold and varied (the default)
; All of it, shot by shot: docs/PRESETS.md.
sPreset=Nebula

; Each preset's own cutting rhythm:
;   Standard       a new angle every 2-3 lines, never just because the turn passed (CCC)
;   Close          every 3-6 lines (CCC)
;   Room           every 3-5 lines (CCC)
;   Frontier       every 2-4 lines, and a fresh angle on a quarter of the turns
;   Starborn       long holds: every 4-7 lines, never on the turn
;   Constellation  every 3-5 lines, a fresh angle on a quarter of the turns
;   Nebula         every 3-5 lines, a fresh angle on 40% of the turns
; (Your turns count as lines.) How lively the cutting is, relative to that rhythm, from -2
; (calmer) to +2 (livelier), in steps of 0.5; 0 = the preset as designed. Each step makes the
; lines between new angles and the shortest hold about a quarter longer or shorter, and a
; fresh angle when the turn passes 20 points less or more likely.
; Each preset can have its own: fCuttingPaceNebula=-0.5, fCuttingPaceStarborn=1 and so on
; (Standard, Close, Room, Frontier, Starborn, Constellation, Nebula); the settings page sets
; the one of the preset in use. fCuttingPace applies to the presets without their own.
fCuttingPace=0

; The 180-degree rule. Each conversation is staged from one side of the line between you
; (the side with more room, or a coin toss).
; 1 = every shot from that one side (you over one shoulder, them over the other), so you
; face each other across every cut, as in films. 0 = each of you is filmed over your own
; same-side shoulder (CCC's default).
bTrue180=0

; 1 = camera moves during shots (push in, crane, drift...), 0 = all shots locked off.
bCameraMoves=1

; Emotion close-ups of the speaker: a line tagged with an expression gets a close-up of the
; speaker, pushing in (seated people and merchants too). CCC does this for lines Skyrim's
; writers marked at full strength; Starfield's lines only have an expression tag, so the
; expressions come in three tiers (mild, medium, strong), each with its own chance
; ([PresetTuning]). Neutral and Friendly (a quarter of all lines) get none.
; -1 = the preset's own: CCC's presets as CCC (none in Standard and Room, strong lines only
; in Close), every tier in CCC SF's; 0 none, 1 every tier in every preset.
bEmotionCloseUpsNpc=-1

; Persuasion beat (CCC's "Hold On Their Answer"): the NPC's answer is a close-up of them,
; pushing slowly in (in a long answer, over 10 s, one wider shot of them once the push-in
; is done). In the persuasion mini-game, their answer to every round, the verdict included;
; seated people and merchants too.
;  - CCC's presets: held for their whole reply, never away from them, as CCC does.
;  - CCC SF's presets: held for the answer and the verdict, then a shot of you, reacting.
; Also for options tagged with a skill check (sBeatTags in [Advanced]; [Persuade] itself
; starts the mini-game).
bPersuasionBeatNpc=1

; Reaction shots of you: one of their lines shown on you, listening, to break up a long
; stretch: due after a while of their talking without a shot of you, and taken by their next
; line of a suitable length, so the cuts fall between lines; also right after a
; persuasion's verdict. When and how often: [PresetTuning]. Full rules: docs/REACTIONS.md.
; -1 = the preset's own: off in CCC's presets (as CCC ships), on in CCC SF's; 0 off, 1 on.
bReactionShotsPlayer=-1
; A close-up of you when you choose a tagged option ([Persuade], [Intimidate], [Chef],
; [Ronin], [Wanted]... every tag but [Pay ...]), for the line you say, shown as you pick,
; over the start of their answer: an extreme close-up for the confrontational skills
; (Intimidate, Threaten, Manipulate, Deceive, Lie, Attack), the others sometimes.
; -1 = the preset's own: CCC SF's presets (CCC doesn't; it holds on their answer instead, as
; bPersuasionBeatNpc does here); 0 off, 1 on in every preset.
bChoiceCloseUpsPlayer=-1

; 1 = your character's face takes expressions during conversations (the game keeps it
; neutral): while the NPC speaks, a response to their line's expression (a smile for a
; smile, concern for worry, a guarded look or anger back for anger); when you choose an
; option with a skill tag ([Persuade], [Intimidate]...), an expression for it. Your face
; goes back to the game's own when the conversation ends. How often your background shows,
; and a questioning look on questions: [PresetTuning].
bFacePlayer=1

[Camera]
; How much the camera sways with the two of you, 0-100%. Its angles are measured off the
; line between you; heads swaying a few centimetres turn that line, and a camera several
; metres out swings with it. 0 = no sway (the line from where you stand, like a camera on a
; tripod), 100 = the full sway (the line between your heads); in between dampens it.
; -1 = the preset's own: 0 in CCC's (a tripod, as CCC), Starborn 15 (barely there), Nebula 40,
; Frontier 45 (a touch of handheld), Constellation 50 plus a slow handheld wander (the
; documentary operator's). 0 also turns Constellation's handheld wander off.
iCameraSway=-1

; 1 = quest scenes you're part of (someone walks up and starts talking, several people
; taking turns) keep the game's own camera; the game directs its camera there. Everyday
; background scenes (merchants, people chatting) keep this mod's camera. 0 = always this
; mod's camera.
bGameCameraInScenes=1

; Focus style (the person in shot is always in focus):
;   Cinematic - more background blur
;   Wide      - deeper sharp zone, softer background blur on the longer shots
sFocusStyle=Wide

[Interface]
; Black bars across the top and bottom of the screen while the camera films a
; conversation (not in quest scenes, where the game keeps its own camera). They sit under
; the dialogue menu, so its subtitles and options stay on top. fLetterboxHeight is each
; bar's share of the screen height (0.12 is close to a 2.39:1 film frame on a 16:9 screen).
bLetterbox=1
fLetterboxHeight=0.12

; 0 = the subtitle stays where the game puts it (vanilla positioning, kept for mods that
; place subtitles themselves). There it can overlap the top edge of the bottom bar, partly
; on the bar and partly on the picture.
; 1 = while the bars are in, move it down so it's centred in the bar, and back when they go.
bSubtitlesInBars=0

; The dialogue options. The game hides them during most NPC lines, but brings them back
; before some lines have ended (often near the end, or in lines that come in parts), and shows
; them during the greeting, with the subtitle running across the last one.
; bHideOptionsWhileSpeaking: 1 = they stay hidden for the whole of every NPC line and come
;   back as it ends (CCC's "Fade Out Dialogue"), except during their first line: the game
;   shows the options during greetings, where A or a click chooses one rather than skipping
;   the line, so they stay visible then. 0 = as the game does. They can still be chosen while
;   hidden on later lines.
bHideOptionsWhileSpeaking=1

[SceneFilming]
; Filming people talking near you. When people within fListenRange metres talk to
; each other, the camera can film whoever is speaking against whoever they're addressing, a
; new shot for each line. Moving, a conversation of your own, combat, a loading screen, or
; the conversation ending hands the camera back (when: [Advanced]). Never offered or
; started in combat. One scene at a
; time, the nearest first, then the next one nearby; a scene that goes on into the game's
; next scene with the same people is followed; one that only repeats itself is handed back.
; Letterboxed (bLetterbox), with a group shot now and then when three or more are talking.
bFilmConversationsNpc=1
; Two ways to start it (both can be on):
; 1 = a prompt on screen, below the crosshair, in the look of the game's own interaction
;     prompt: "Listen in on nearby conversation. Press N" (or "Hold" and the B button's
;     icon with a controller). The listen key or button starts it and stops it. Not shown
;     while bAutoListen is on (it starts on its own then). While the camera films them,
;     the game's HUD is hidden (crosshair, name tags, compass, watch, health, weapon).
bListenPrompt=1
; 1 = it starts on its own when a conversation begins near you (within fListenRange), also
;     while you walk or jog up to it or past it, but not while you sprint. Heads up: the
;     camera is taken over by these scenes, and you're stopped where you are until you let
;     go of the movement controls (see below). A conversation you've ended by moving or with
;     the listen key doesn't start again on its own for two minutes (the listen key: none at
;     all for a minute).
; Both only for conversations (the game's scenes of people talking); barks and one-liners
; ("Need something?") are left alone. The listen key still films anyone talking, with either
; on; with both off, nothing starts filming (the key included). Off by default.
bAutoListen=0
; 1 = it also starts on its own while you sprint past (0 = only walking and jogging; sprinting
; is faster than 6.5 m/s).
bAutoListenSprinting=0
; Moving ends it. When it starts on its own, it stops you where you are: your movement is
; held until you let go of every movement input (W, A, S, D, the arrow keys, the left stick),
; and moving again then gives you your controls back and ends it. Looking around (the
; mouse, the right stick) is off while it films, however it started. (The distances: in
; [Advanced].)
; The listen key on the keyboard, as a Windows virtual-key code (78 = N; 0 = none).
iListenKey=78
; The controller's listen button, held for half a second (so a tap still does what the game
; uses it for). XInput button codes: 8192 = B (default), 128 = right stick click,
; 64 = left stick click, 1/2/4/8 = D-pad up/down/left/right, 32 = View, 256/512 = LB/RB,
; 4096/8192/16384/32768 = A/B/X/Y; 0 = no controller button.
iListenButton=8192
fListenRange=12

[Debug]
; Testing aids and troubleshooting.
; 1 = on-screen messages while testing: each spoken line's expression tag, and each shot
; the camera uses by its [Shots] name and why. A line and the cut it brings show as one
; message, e.g. "Sarah Morgan: Surprised (#3) | Camera: CloseUp (emotion close-up)";
; "same shot" means the camera held its shot for that line, "no close-up" that a close-up
; expression didn't get one. Handy for sorting the sCloseUpEmotions...Npc tiers and building
; your own mix of shots.
bShowMessages=0
; While a conversation is filmed, the messages show in the top bar, looking like the game's
; own notifications; outside conversations they're the game's own notifications. The preset in
; use stays in the bottom bar's right-hand side ("PRESET: FRONTIER").
; How long a testing message stays in the top bar, at most (seconds, 1-30).
fMessageSeconds=6
; The preset key: switches to the next preset on the fly while a conversation (or people
; talking near you) is filmed (Standard, Close, Room, Frontier, Starborn, Constellation,
; Nebula, then Standard again), until the game is restarted; sPreset sets the one it starts
; with. Only then, so a U typed into a name elsewhere changes nothing. A Windows virtual-key
; code: 85 = U (Starfield doesn't use U; P is its Skills key). 0 = no key.
iPresetKey=85

; For troubleshooting (all on normally; turn one off only to rule it out):
; Obstacle detection: before cutting to a shot, ask the game's collision whether anything
; (a wall, a ladder, a pillar) stands between the camera and the person in shot. A wall
; behind the camera pulls the camera in; anything close to the person skips the shot.
bObstacleCheck=1
; Bystanders: someone standing still who would cover a face or most of the picture makes
; the camera pull in past them or pick another angle, like a wall. People walking through
; the shot are left in: they keep it lively.
bAvoidBystandersNpc=1
; Close-ups follow the face (CCC's bFollowFace): the camera turns toward a face turned to
; its work (up to 35 degrees) and drops to look up into a lowered one, decided at each cut.
bFollowFace=1
; Focus on the person in shot: the game's conversation blur focused to the distance from the
; camera to whoever is in shot, on every shot, and no blur on room shots (over 8 m). Off,
; the game's own blur focuses about 2 m from the camera: anyone further away is soft.
bFocusOnSubject=1
; Show your character during conversations (Starfield hides them); off, the shots of you show
; where you'd be.
bRevealPlayer=1
; The shot library (all of [Director]): 0 = only the plain over-the-shoulder shot.
bDirector=1
; When a conversation starts in first person, build your character's full body first; off,
; the first-person body shows, which looks broken. The step most likely to clash with a mod
; that changes your body, skeleton or first-person view: turn it off to rule that out.
bFixFirstPersonBodyPlayer=1

[PresetTuning]
; Each preset's own numbers, for fine-tuning a preset's style (a preset editor is planned
; after 1.0). -1 (or 0 where it says so) = the preset's own; a number sets it for every
; preset. All of it, preset by preset: docs/PRESETS.md.

; ---- Lens and distances ---------------------------------------------------------------
; The conversation lens, in degrees. Starfield films conversations through a narrow 30
; degree lens, so CCC's framings need the camera about twice as far back as in Skyrim: wide
; shots rarely fit indoors and over-the-shoulder shots meet walls more often. A wider lens
; frames the same shots from closer, with less of the flattened, telephoto look. Only while
; this mod films a conversation.
; -1 = the preset's own: each angle with its own lens, as the preset sets them (CCC's
;      numbers in CCC's presets; see docs/PRESETS.md)
; 20-70 = one lens for every angle and every preset (30 = the game's own)
fConversationLens=-1

; The furthest the camera may stand from the person it frames, in metres, indoors and
; outdoors. Starfield's conversation lens is narrower than the ones CCC uses in Skyrim,
; so its framings want the camera further back. 0 = the preset's own, as far as its
; widest shot wants (obstacle detection keeps the camera out of walls):
;   Close     5 m indoors,  5 m outdoors
;   Standard  7 m indoors, 10.5 m outdoors (the two-shot of you both needs 10.2 m)
;   Room      7 m indoors, 13 m outdoors (the full-figure shots need 12.7 m)
;   Starborn  5 m indoors,  5 m outdoors (as Close)
;   Constellation, Frontier, Nebula  7 m indoors, 13 m outdoors (as Room)
; Any other value (1-15) is your own limit, whatever the preset; lower values make the
; wider shots tighter, never wider.
fMaxCameraDistance=0
fMaxCameraDistanceExterior=0
; Room shots (Wide, Master, Distant, DistantLow; which preset uses which: docs/PRESETS.md)
; stand where the room measurement found space on the conversation's side, with both faces
; in view, as far back as CCC's framing wants. How far back they may stand, in metres,
; indoors and outdoors. -1 = the preset's own (CCC's presets: as far as CCC's framing wants,
; about 12 to 18 m at the 45 degree lens; CCC SF's: 9 m indoors, 12 m outdoors); 0 = as far as
; CCC's framing wants in any preset; any other value is your own limit. The limit is for the
; furthest (Master); Distant and Wide stay closer in proportion. Closer makes the people
; larger.
fRoomShotMaxIndoors=-1
fRoomShotMaxOutdoors=-1

; ---- Their close-ups ------------------------------------------------------------------
; Emotion close-ups of the speaker (bEmotionCloseUpsNpc): the chance (%) for each tier of
; expression (which expressions are in which tier: sCloseUpEmotions...Npc in [Advanced]):
;   mild    everyday tone
;   medium  real but often understated feeling
;   strong  what close-ups are for
; At these chances, about one NPC line in five gets one.
iCloseUpChanceMildNpc=25
iCloseUpChanceMediumNpc=40
iCloseUpChanceStrongNpc=100
; Of those close-ups, how many (%) are extreme close-ups (CCC: about a third).
; -1 = the preset's own: Frontier 25 (the western keeps them rare), the others 40.
iExtremeCloseUpChanceNpc=-1
; The longest one close-up of them holds (seconds, 4-60) before a wider shot of them (a run
; of emotional lines can otherwise hold one for half a minute): -1 = the preset's own
; (Frontier 12, Starborn 18, Constellation 14, Nebula 12; none in CCC's presets); 0 = none.
fCloseUpLimitSecondsNpc=-1

; ---- Reactions of you -----------------------------------------------------------------
; Reaction shots of you (bReactionShotsPlayer): due after fReactionAfterSecondsPlayer of their
; talking without a shot of you (your own turns start the count again), taken
; iReactionChancePlayer % of the time. -1 = the preset's own (Frontier 10 s, Starborn 9 s,
; Constellation 12 s, Nebula 7 s).
fReactionAfterSecondsPlayer=-1
iReactionChancePlayer=100
; How long a reaction of you lasts on a long line of theirs: a line up to a second longer
; than this is shown on you whole; a longer one is shown on you for this many seconds, then
; back to them (0 = wait for a line that suits).
fReactionLongLineSecondsPlayer=4
; ---- Close-ups of you -----------------------------------------------------------------
; A reaction is either you listening (the preset's angle of you: your regular shots, never
; the room or a two-shot) or, when your face shows an expression on that line, a close-up
; of you, by the expression's tier (the same lists as for them): these % of the time
; (iExtremeCloseUpChancePlayer of those extreme close-ups; also the share for the close-up of
; you on a tagged choice that isn't confrontational).
iCloseUpChanceMildPlayer=25
iCloseUpChanceMediumPlayer=40
iCloseUpChanceStrongPlayer=100
; (Constellation has no extreme close-ups of you: a documentary doesn't go that close.)
iExtremeCloseUpChancePlayer=40
; Listening reactions on a close-up of you too: -1 = the preset's own (yes, except Frontier,
; which keeps them in mediums and three-quarters and saves your close-ups for your
; expressions); 0 no, 1 yes. A reaction is never the overhead shot of you.
bListeningCloseUpsPlayer=-1

; ---- Your face ------------------------------------------------------------------------
; Your face (bFacePlayer in [Director]); the same for every preset for now, which the preset
; editor could change.
; Your background shows on your face now and then: at moments it would otherwise be neutral
; (an NPC line with no expression, an option without a skill tag), this chance (%, 0-100)
; of your background's expression instead: Space Scoundrel and Cyber Runner smirk, Gangster
; looks smug, Bounty Hunter suspicious, Diplomat and Homesteader friendly, Professor and
; Sculptor thoughtful, Soldier and Beast Hunter serious, Bouncer and Ronin stern, Chef happy,
; Combat Medic concerned, Explorer awed, Industrialist confident, Long Hauler tired, Pilgrim
; at ease, Cyberneticist and Xenobiologist focused. Full tables: docs/EMOTIONS.md.
iSignatureChancePlayer=30
; An option without a tag that asks a question ("...?"): this chance (%, 0-100) you ask it
; with a questioning look.
iQuestionChancePlayer=40

[Shots]
; Change individual shots of the preset. Remove the ";" to use a line.
; Weight (how often it's picked, 0-100; 0 turns it off, and a shot the preset doesn't
; use can be added this way):
;CloseUp=80
; Move: None, Push in, Pull out, Crane up, Crane down, Tilt up, Tilt down, Drift,
; Zoom in, Zoom out (done as push/pull here), Orbit left, Orbit right, Slide left,
; Slide right. Amount 0-100, time in seconds.
;CloseUpMove=Push in
;CloseUpMoveAmount=40
;CloseUpMoveTime=6
;
; Shot names, of them: OverPlayerShoulder, OverPlayerShoulderLow, OverPlayerShoulderHigh,
; OverPlayerShoulderWide, DirtyNpc, ThreeQuarterNpc, CloseUp, ExtremeClose, CloseLow,
; CloseHigh, CloseProfile, CloseWide, MediumNpc, MediumProfile, LowAngle, LowProfile,
; LongNpc, Overhead
; Of you: OverNpcShoulder, OverNpcShoulderLow, OverNpcShoulderHigh, OverNpcShoulderWide,
; DirtyPlayer, ThreeQuarterPlayer, ClosePlayer, ExtremeClosePlayer, MediumPlayer,
; PlayerProfile, PlayerLow, HighAngle, LongPlayer, PlayerOverhead
; Of both: TwoShot, Profile (the two-shot needs about 10 m, so outdoors only by default)
; Of the room (where the room measurement finds space): Wide, Master, Distant, DistantLow

[Advanced]
; Technical settings and workarounds, rarely worth changing: each was set from testing.

; ---- Shots ----------------------------------------------------------------------------
; 1 = no shot, camera move or face turn takes the camera across the line between you, or
; within a few degrees of it (always on with bTrue180).
bEnforceLine=1
; Who gets the camera: 0 = always over your shoulder (the NPC in frame), 1 = always over
; their shoulder (you in frame), 2 = whoever is talking (shot/reverse-shot).
iShotMode=2
; 1 = people sitting down and merchants get the plain over-the-shoulder shot instead of the
; shot library: its angles often put the chair or the shop counter in front of them.
; Close-ups still come in over it (emotions, persuasion answers, your reactions); a reaction
; of you listening is the plain shot of you.
bPlainShotsSeatedNpc=1
bPlainShotsMerchantsNpc=1
; Speakers shorter than this (metres, head above feet), or without a head (small robots),
; keep the game's own camera.
fMinSpeakerHeightNpc=1.0
; Large speakers: a head this high above their feet (metres; Vasco 1.75, people about 1.6)
; would hide you in the narrower shots of you, so every shot of you keeps to
; fLargeSpeakerAnglePlayer degrees off the line between you or wider, and the plain shot of
; you to fLargeSpeakerPlainAnglePlayer. Their own shots are unchanged. 0 = off.
fLargeSpeakerHeightNpc=1.70
fLargeSpeakerAnglePlayer=38
fLargeSpeakerPlainAnglePlayer=45

; ---- Close-ups ------------------------------------------------------------------------
; The expressions' tiers for the close-ups of them (and of you): move an expression between
; lists to change its tier. All the game's expressions: docs/EMOTIONS.md.
sCloseUpEmotionsMildNpc=Amused,Confident,Thinking,Grateful,Question,Impressed,Tired,Concentrating,Relieved
sCloseUpEmotionsMediumNpc=Concerned,Serious,Smirk,Happy,Confused,Puzzled,Apologetic,Awed
sCloseUpEmotionsStrongNpc=VeryAngry,Rage,Angry,Irritated,Afraid,Shocked,Surprised,Disgust,Somber,Depressed,Worried,Nervous,Pleading,Disbelief,Defiant,Stern,Suspicious,Smug,Sarcastic,Flirting,SinisterSmile,InPain,Dying,EyesClosed
; The skill-check tags that get the persuasion beat (bPersuasionBeatNpc). A tag starting with
; a word on the list counts; "Pay" would also match "[Pay 500 Credits]", which is how you hire
; crew, so it isn't on the list.
sBeatTags=Intimidate,Intimidation,Manipulate,Manipulation,Bribe,Deceive,Deception,Lie,Threaten,Diplomacy,Negotiate,Negotiation,Commerce

; ---- Exits and screen -----------------------------------------------------------------
; How a conversation ends. After the last line the game takes about 1.5 s to give you your
; camera back; when it does, your body is swapped back (from first person) and the
; conversation's blur goes off, which on a still shot shows as a jump.
;   1 = a closing shot of the NPC alone, cut to as the dialogue menu closes;
;   2 = a cut back to your own view: from first person just after the last line; from third
;       person on the frame the game takes over, so the change happens in the cut.
; Frame by frame: docs/TRANSITIONS.md.
iExitStyle=2
; How long the letterbox bars take to slide in or out (seconds), and the dialogue options to
; fade in and out (seconds, up to 1.5; 0 = at once; when the game hides them itself, after
; you choose, they go at once whatever this is).
fLetterboxFade=0.4
fOptionsFade=0

; ---- Filming people talking -----------------------------------------------------------
; The camera is handed back fFilmEndSecondsNpc after the last word, or up to
; fFilmEndSecondsSceneNpc while they're still playing their part in one of the game's scenes
; (which pause between lines).
fFilmEndSecondsNpc=0.5
fFilmEndSecondsSceneNpc=4
; Once you've stood still, moving fFilmStopDistance metres from that spot ends it (for
; remapped movement keys). When you start it with the listen key, walking on
; fFilmWalkOnDistance metres from where it started ends it.
fFilmStopDistance=0.25
fFilmWalkOnDistance=3

[GameSettings]
; The game's own settings, changed while it runs ("name:Section=value"). Remove the ";"
; to use a line; put it back to restore the game's value. Possibly makes conversation
; starts a little sharper:
;fDialogueCameraResumeTime:Dialogue=0
