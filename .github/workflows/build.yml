name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Configure
        run: xmake config -y -m releasedbg

      - name: Build
        run: xmake build -y -v

      - name: Package mod files
        shell: pwsh
        run: |
          $out = "package/Data/SFSE/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dll = Get-ChildItem -Recurse -Path build -Filter "CinematicConversationCameraSF.dll" | Select-Object -First 1
          $pdb = Get-ChildItem -Recurse -Path build -Filter "CinematicConversationCameraSF.pdb" | Select-Object -First 1
          if (-not $dll) { throw "DLL not found" }
          Copy-Item $dll.FullName $out
          if ($pdb) { Copy-Item $pdb.FullName $out }
          Copy-Item "data/SFSE/Plugins/CinematicConversationCameraSF.ini" $out
          Copy-Item LICENSE package/
          Copy-Item README.md package/


      # A second download route: one rolling pre-release, "Test build", whose file each build on
      # main replaces. Alpha only; per-version releases start at beta.
      - name: Update the test build pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path xmake.lua -Pattern 'set_version\("([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw "version not found in xmake.lua" }
          $tag = "test-build"
          $zip = "CinematicConversationCameraSF-test-build.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          $notes = "ALPHA - for testing only. Not ready for general use; settings and behaviour change from build to build, and it writes detailed logs.`n`nCurrent build: $version (commit ${{ github.sha }}). Copy the Data folder into your Starfield folder, or install the zip with a mod manager."
          # Move the tag to this build, then replace the file and the notes.
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" -f sha=${{ github.sha }} -F force=true 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha=${{ github.sha }} 2>$null
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
            gh release edit $tag --prerelease --title "Test build $version (alpha)" --notes $notes
          } else {
            gh release create $tag $zip --prerelease --verify-tag --title "Test build $version (alpha)" --notes $notes
          }

      - name: Upload mod
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: CinematicConversationCameraSF
          path: package/
