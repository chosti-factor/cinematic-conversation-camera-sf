name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Configure
        run: xmake config -y -m releasedbg

      - name: Build
        run: xmake build -y -v

      - name: Package mod files
        shell: pwsh
        run: |
          # The zip's top level is SFSE (the user, 2026-11-26: MO2 wants SFSE at the top, not Data),
          # so it unpacks straight into the game's Data folder. The licence and readme go next to the
          # DLL under the mod's own name, not loose in Data.
          $out = "package/SFSE/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dll = Get-ChildItem -Recurse -Path build -Filter "CinematicConversationCameraSF.dll" | Select-Object -First 1
          $pdb = Get-ChildItem -Recurse -Path build -Filter "CinematicConversationCameraSF.pdb" | Select-Object -First 1
          if (-not $dll) { throw "DLL not found" }
          Copy-Item $dll.FullName $out
          if ($pdb) { Copy-Item $pdb.FullName $out }
          Copy-Item "data/SFSE/Plugins/CinematicConversationCameraSF.ini" $out
          Copy-Item LICENSE "$out/CinematicConversationCameraSF-LICENSE.txt"
          Copy-Item README.md "$out/CinematicConversationCameraSF-README.md"


      # One rolling pre-release, "Test build", whose file each build on main replaces: the
      # newest build, for testing. Versioned releases come from v* tags (below).
      - name: Update the test build pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path xmake.lua -Pattern 'set_version\("([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw "version not found in xmake.lua" }
          $tag = "test-build"
          $zip = "CinematicConversationCameraSF-test-build.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          $notes = "The newest build from the main branch, for testing; it can change from build to build. For the current release, see the versioned releases.`n`nBuild: $version (commit ${{ github.sha }}). Install the zip with a mod manager, or copy its SFSE folder into your Starfield Data folder."
          # Move the tag to this build, then replace the file and the notes.
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" -f sha=${{ github.sha }} -F force=true 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha=${{ github.sha }} 2>$null
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
            gh release edit $tag --prerelease --title "Test build $version" --notes $notes
          } else {
            gh release create $tag $zip --prerelease --verify-tag --title "Test build $version" --notes $notes
          }

      # A versioned release (1.0 on): pushing a tag vX.Y.Z builds that commit and publishes
      # CinematicConversationCameraSF-X.Y.Z.zip. The tag has to match xmake.lua's version.
      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path xmake.lua -Pattern 'set_version\("([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"
          if ("v$version" -ne $tag) { throw "tag $tag doesn't match xmake.lua's version $version" }
          $zip = "CinematicConversationCameraSF-$version.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          $notes = "Cinematic Conversation Camera SF $version.`n`nInstall the zip with a mod manager, or copy its SFSE folder into your Starfield Data folder. Requires Starfield 1.16.244, SFSE and Address Library for SFSE Plugins; SFSE Menu Framework is optional (the in-game settings page). What changed: CHANGELOG.md."
          gh release create $tag $zip --verify-tag --title "Cinematic Conversation Camera SF $version" --notes $notes

      - name: Upload mod
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: CinematicConversationCameraSF
          path: package/
