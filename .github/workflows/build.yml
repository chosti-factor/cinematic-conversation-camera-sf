name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Configure
        run: xmake config -y -m releasedbg

      - name: Build
        run: xmake build -y -v

      - name: Package mod files
        shell: pwsh
        run: |
          $out = "package/Data/SFSE/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dll = Get-ChildItem -Recurse -Path build -Filter "CinematicConversationCameraSF.dll" | Select-Object -First 1
          $pdb = Get-ChildItem -Recurse -Path build -Filter "CinematicConversationCameraSF.pdb" | Select-Object -First 1
          if (-not $dll) { throw "DLL not found" }
          Copy-Item $dll.FullName $out
          if ($pdb) { Copy-Item $pdb.FullName $out }
          Copy-Item "data/SFSE/Plugins/CinematicConversationCameraSF.ini" $out
          Copy-Item LICENSE package/
          Copy-Item README.md package/


      # A second download route: each build on main also goes on the Releases page as a
      # pre-release named after its version (rebuilds of the same version replace the file).
      - name: Publish pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path xmake.lua -Pattern 'set_version\("([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw "version not found in xmake.lua" }
          $tag = "v$version"
          $zip = "CinematicConversationCameraSF-$version.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          $notes = "Alpha test build $version (commit ${{ github.sha }}). Copy the Data folder into your Starfield folder, or install the zip with a mod manager."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --prerelease --target ${{ github.sha }} --title "Cinematic Conversation Camera SF $version (alpha)" --notes $notes
          }

      - name: Upload mod
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: CinematicConversationCameraSF
          path: package/
